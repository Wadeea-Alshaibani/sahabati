
name: Docker Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        run: docker build -t sahabati-app:latest .
      
      - name: Run tests
        run: docker run --rm sahabati-app:latest echo "Build successful!"
      
      - name: Log completion
        run: echo "Docker build completed successfully!"
